# Publishes an over-the-air (OTA) update to installed apps on every push to main.
#
# - Covers JavaScript/TypeScript, styling and image changes.
# - Native changes (new native packages, permissions, icons, app.json android/ios
#   settings) need a new store build instead: bump "version" in app.json, then
#   run `npm run build:android:aab` and upload the new .aab to Google Play.
#
# One-time setup: add an EXPO_TOKEN repository secret
# (expo.dev -> Account settings -> Access tokens -> Create token).
name: Publish OTA update

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eas-update-production
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Same values the production build uses (eas.json -> build.production.env)
      EXPO_PUBLIC_API_URL: https://api.onedelivery.co.tz/api
      EXPO_PUBLIC_SOCKET_URL: https://api.onedelivery.co.tz
      EXPO_PUBLIC_APP_ENV: production
    steps:
      - name: Check EXPO_TOKEN secret
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::Missing EXPO_TOKEN secret. Create a token at expo.dev (Account settings -> Access tokens) and add it in GitHub: Settings -> Secrets and variables -> Actions."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Publish update to production channel
        run: eas update --channel production --environment production --message "$(git log -1 --pretty=%s)" --non-interactive
